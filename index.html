<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proposal Page</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffe6f0, #fff0f5);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Pages */
.page {
    text-align: center;
    transition: 0.5s;
}

.hidden {
    display: none;
}

/* Heart container (optional future use) */
#hearts-container {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* Emoji styles */
.ring {
    font-size: 180px;
    animation: sparkle 2s infinite;
}

.kiss {
    font-size: 200px;
    animation: bounce 1.5s infinite;
}

/* Buttons */
.buttons {
    display: flex;
    gap: 20px;
    margin-top: 25px;
    justify-content: center;
}

button {
    border: none;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 15px 30px;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

#acceptBtn {
    background: #ff69b4;
}

#declineBtn {
    background: #ff4d6d;
    position: relative;
}

/* Animations */
@keyframes sparkle {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Text */
h1 {
    margin-top: 20px;
    color: #d63384;
}

p {
    font-size: 18px;
    color: #444;
    max-width: 400px;
    margin: auto;
}
</style>

</head>

<body>

<div id="proposal-page" class="page">

    <div class="ring">💍</div>

    <h1>For My Beautiful Bebe Aira 💖</h1>

    <p>
        Will you accept this ring as a sign of my apology and love?
    </p>

    <div class="buttons">
        <button id="acceptBtn">💍 Accept Ring</button>
        <button id="declineBtn">❌ Decline</button>
    </div>

</div>

<div id="thankyou-page" class="page hidden">

    <div class="kiss">😘</div>

    <h1>Thank You, Bebe Aira ❤️</h1>

    <p>
        Thank you for accepting my apology.
        I love you always bebe aira ko lagi kung pag bubutihin maging bf mo araw araw.
    </p>

</div>

<script>
const acceptBtn = document.getElementById("acceptBtn");
const declineBtn = document.getElementById("declineBtn");

const proposalPage = document.getElementById("proposal-page");
const thankyouPage = document.getElementById("thankyou-page");

acceptBtn.addEventListener("click", () => {
    proposalPage.classList.add("hidden");
    thankyouPage.classList.remove("hidden");
});

declineBtn.addEventListener("click", () => {
    alert("⚠️ Error");
    alert("❌ Invalid Choice");

    const maxX = window.innerWidth - declineBtn.offsetWidth;
    const maxY = window.innerHeight - declineBtn.offsetHeight;

    declineBtn.style.position = "absolute";
    declineBtn.style.left = Math.random() * maxX + "px";
    declineBtn.style.top = Math.random() * maxY + "px";
});
</script>

</body>
</html>
